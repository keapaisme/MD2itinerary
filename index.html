<!DOCTYPE html>
<!-- Version: v1.1 | Description: 將成員個人頭像標籤與身分說明匿名化更名為 成員1(隊長)、成員2、成員3、成員4。 -->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旅遊🧳手書 | Agent-Native 動態旅遊手冊</title>
    <meta name="description" content="旅遊🧳手書 — Agent-Native 動態元件架構旅遊手冊。">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/main.css?v=20260802_v20">


</head>
<body>
    <div class="app-container">
        
        <!-- 通用密碼解鎖遮罩 -->
        <div id="loginOverlay" class="login-overlay hidden">
            <div class="login-box">
                <h1 class="login-title">旅遊🧳手書</h1>
                <p class="login-subtitle">請選擇您的成員身分並輸入 4 位解鎖通行密碼 (預設: 2026)</p>
                
                <!-- 4人成員身分選取 -->
                <div id="loginMemberSelect" class="family-avatars" style="justify-content:center; gap:8px; margin-bottom:18px;">
                    <div class="avatar-pill active" onclick="UIEngine.selectLoginMember('成員1')" data-member="成員1" style="border-color: var(--color-husband); cursor:pointer;">
                        <span class="avatar-name" style="color: var(--color-husband);">成員1</span>
                        <span class="avatar-role">成員1 (隊長)</span>
                    </div>
                    <div class="avatar-pill" onclick="UIEngine.selectLoginMember('成員2')" data-member="成員2" style="border-color: var(--color-wife); cursor:pointer;">
                        <span class="avatar-name" style="color: var(--color-wife);">成員2</span>
                        <span class="avatar-role">成員2</span>
                    </div>
                    <div class="avatar-pill" onclick="UIEngine.selectLoginMember('成員3')" data-member="成員3" style="border-color: var(--color-elder); cursor:pointer;">
                        <span class="avatar-name" style="color: var(--color-elder);">成員3</span>
                        <span class="avatar-role">成員3</span>
                    </div>
                    <div class="avatar-pill" onclick="UIEngine.selectLoginMember('成員4')" data-member="成員4" style="border-color: var(--color-younger); cursor:pointer;">
                        <span class="avatar-name" style="color: var(--color-younger);">成員4</span>
                        <span class="avatar-role">成員4</span>
                    </div>
                </div>

                <div class="passcode-inputs">
                    <input type="password" maxlength="1" class="passcode-digit" autofocus>
                    <input type="password" maxlength="1" class="passcode-digit">
                    <input type="password" maxlength="1" class="passcode-digit">
                    <input type="password" maxlength="1" class="passcode-digit">
                </div>
                <button id="loginBtn" class="btn-primary">驗證並開啟手冊</button>
                <div style="margin-top:12px;">
                    <button onclick="UIEngine.resetCacheAndReload()" style="background:none; border:none; color:var(--text-muted); font-size:0.72rem; cursor:pointer; text-decoration:underline;">🧹 清除快取與登入狀態重跑 (Hard Reload)</button>
                </div>
            </div>
        </div>

        <!-- 頂部 Hero 區塊 (直接載入 AI 漫畫封面背景) -->
        <header id="headerHero" class="header-hero">
            <h1 class="hero-title">旅遊🧳手書</h1>
            <p class="hero-subtitle">動態行動旅遊手冊</p>
            
            <!-- 當前選定身分標示 -->
            <div style="display:flex; justify-content:center; margin-top:8px;">
                <div id="currentMemberPill" class="avatar-pill" style="border-color: var(--color-husband); background: rgba(0,0,0,0.4);">
                    <span id="currentMemberName" class="avatar-name" style="color: var(--color-husband);">成員1</span>
                    <span id="currentMemberRole" class="avatar-role">當前使用者: 成員1 (隊長)</span>
                </div>
            </div>

            <!-- 正式交付：隱藏目的地行程切換 -->
            <div style="display: none; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); padding: 10px; border-radius: 12px; margin-top: 12px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.75rem; font-weight:700; color:var(--color-primary);">🌍 目的地行程切換</span>
                    <select id="countrySelect" style="width:200px; padding:6px; border-radius:8px; background:var(--bg-secondary); color:#fff; border:1px solid var(--border-color); font-size:0.75rem; outline:none;">
                        <option value="japan">🇯🇵 日本 關東遊 (japan.json)</option>
                        <option value="paris">🇫🇷 巴黎 奢華遊 (paris.json)</option>
                        <option value="china">🇨🇳 中國 大理江南遊 (china.json)</option>
                        <option value="swiss">🇨🇭 瑞士 阿爾卑斯遊 (swiss.json)</option>
                        <option value="taiwan">🇹🇼 台灣 環島機車遊 (taiwan.json)</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Sticky Navigation 頁籤選單 -->
        <nav class="sticky-nav">
            <div class="nav-tabs">
                <button class="tab-item active" data-target="day1View">Day 1</button>
                <button class="tab-item" data-target="day2View">Day 2</button>
                <button class="tab-item" data-target="day3View">Day 3</button>
                <button class="tab-item" data-target="day4View">Day 4</button>
                <button class="tab-item" data-target="day5View">Day 5</button>
                <button class="tab-item" data-target="day6View">Day 6</button>
                <button class="tab-item" data-target="transportView" style="border-color: var(--color-secondary);">🚦 交通攻略</button>
                <button class="tab-item" data-target="budgetView">💰 預算與記帳</button>
            </div>
        </nav>

        <!-- 視圖掛載容器區塊 -->
        <main class="main-content">
            <section id="day1View" class="view-section active"></section>
            <section id="day2View" class="view-section"></section>
            <section id="day3View" class="view-section"></section>
            <section id="day4View" class="view-section"></section>
            <section id="day5View" class="view-section"></section>
            <section id="day6View" class="view-section"></section>
            <section id="transportView" class="view-section"></section>
            <section id="budgetView" class="view-section"></section>
        </main>

    <!-- 🖼️ 全螢幕 Lightbox Popup 漫畫照片彈窗與復刻打卡 -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="UIEngine.handleCameraUpload(event)">
    
    <div id="lightboxModal" class="lightbox-modal" onclick="if(event.target.id==='lightboxModal') UIEngine.closeLightbox()">
        <div style="background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:20px; padding:16px; max-width:600px; width:92%; max-height:90vh; overflow-y:auto; text-align:center; color:#fff; box-shadow:0 0 50px rgba(0,0,0,0.9); border-top:3px solid var(--color-accent);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 id="comicModalTitle" style="font-size:1.05rem; font-weight:800; color:var(--color-accent);">🎨 AI 經典景點漫畫紀念照</h3>
                <span onclick="UIEngine.closeLightbox()" style="font-size:1.5rem; cursor:pointer; color:var(--text-muted); padding:0 6px;">&times;</span>
            </div>
            
            <!-- 🎨 2 版面 DEMO 切換 -->
            <div style="display:flex; justify-content:center; gap:8px; margin-bottom:12px;">
                <button id="demoLayoutBtnA" onclick="UIEngine.switchComicLayout('A')" style="padding:6px 12px; font-size:0.75rem; border-radius:16px; border:1px solid var(--color-primary); background:rgba(56,189,248,0.2); color:var(--color-primary); cursor:pointer; font-weight:600;">🖼️ 版面 1 (動漫經典)</button>
                <button id="demoLayoutBtnB" onclick="UIEngine.switchComicLayout('B')" style="padding:6px 12px; font-size:0.75rem; border-radius:16px; border:1px solid var(--border-color); background:rgba(255,255,255,0.05); color:var(--text-muted); cursor:pointer; font-weight:600;">👥 版面 2 (歡聚打卡)</button>
            </div>

            <div id="comicComparisonArea" style="display:flex; flex-direction:column; gap:12px;">
                <div>
                    <img id="lightboxImg" src="" alt="AI 漫畫合照" style="width:100%; border-radius:12px; border:1px solid var(--border-color); object-fit:cover; max-height:350px;">
                    <div id="comicCaption" style="font-size:0.78rem; color:var(--text-muted); margin-top:6px;">🎨 版面 1: AI 獨家畫風紀念卡案 (現場 1:1 復刻打卡標竿)</div>
                </div>
                <div id="userPhotoContainer" style="display:none;">
                    <div style="font-size:0.82rem; font-weight:700; color:var(--color-success); margin-bottom:6px;">📷 您現場實拍的復刻打卡照片：</div>
                    <img id="userPhotoImg" src="" alt="現場復刻實拍" style="width:100%; border-radius:12px; border:2px solid var(--color-success); object-fit:cover; max-height:350px;">
                </div>
            </div>

            <div style="display:flex; gap:10px; margin-top:16px;">
                <button onclick="document.getElementById('cameraInput').click()" class="btn-primary" style="flex:1; padding:12px; font-size:0.85rem; background:linear-gradient(135deg, var(--color-primary), var(--color-accent)); color:#fff;">📷 實拍一張 復刻打卡</button>
                <button onclick="UIEngine.closeLightbox()" style="padding:12px 18px; font-size:0.82rem; background:rgba(255,255,255,0.1); color:#fff; border:1px solid var(--border-color); border-radius:12px; cursor:pointer;">關閉視窗</button>
            </div>
        </div>
    </div>

    <!-- 🌤️ AI 超奢華雙備選景點與口袋情報 POPUP 模態彈窗 -->
    <div id="backupModal" class="lightbox-modal" onclick="if(event.target.id==='backupModal') UIEngine.closeBackupModal()">
        <div style="background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:20px; padding:20px; max-width:420px; width:92%; max-height:85vh; overflow-y:auto; color:#fff; box-shadow:0 0 50px rgba(0,0,0,0.9); border-top:3px solid var(--color-primary);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 id="backupModalTitle" style="font-size:1.1rem; font-weight:800; color:var(--color-primary);">🌤️ 景點口袋情報與彈性備案</h3>
                <span onclick="UIEngine.closeBackupModal()" style="font-size:1.5rem; cursor:pointer; color:var(--text-muted); padding:0 6px;">&times;</span>
            </div>
            
            <!-- 🌤️ 當地時段氣候預報 -->
            <div id="backupModalWeather" style="background:linear-gradient(90deg, rgba(56,189,248,0.12), rgba(129,140,248,0.12)); border:1px solid rgba(56,189,248,0.25); padding:10px 14px; border-radius:12px; margin-bottom:14px; font-size:0.78rem; display:flex; align-items:center; gap:8px;"></div>

            <!-- 🎯 2 大彈性替代景點 -->
            <div style="font-size:0.82rem; font-weight:700; color:#fff; margin-bottom:8px;">🎯 AI 預先規劃 2 大彈性替代方案：</div>
            <div id="backupModalBody" style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;"></div>

            <!-- 🎥 KOL 達人實測與官方連結錦囊 -->
            <div style="font-size:0.82rem; font-weight:700; color:#fff; margin-bottom:8px;">💡 KOL 達人開箱與官方資訊：</div>
            <div id="backupModalExtra" style="display:flex; flex-direction:column; gap:8px;"></div>

            <button onclick="UIEngine.closeBackupModal()" class="btn-primary" style="margin-top:18px; padding:12px; font-size:0.82rem; background:rgba(255,255,255,0.08); color:#fff; border:1px solid var(--border-color);">關閉情報視窗</button>
        </div>
    </div>




    <script src="js/data_service.js"></script>
    <script src="js/ui_engine.js?v=20260802_v25"></script>




</body>

</html>
